<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Maingelas — drinking game</title>
<meta name="description" content="A drinking game with 1000 preloaded questions.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="app">

  <!-- SETUP SCREEN -->
  <section id="screen-setup" class="screen active">
    <div class="setup-card">
      <div class="logo">
        <h1>Maingelas</h1>
      </div>
      <p class="tagline">Add everyone playing, then start the game.</p>

      <form id="player-form" autocomplete="off">
        <div class="player-input-row">
          <input type="text" id="player-name-input" placeholder="Enter a player name" maxlength="20" />
          <button type="submit" class="btn btn-primary" id="add-player-btn" aria-label="Add player">Add</button>
        </div>
      </form>

      <ul id="player-list" class="player-list"></ul>

      <p id="player-hint" class="hint">Add at least 2 players to start.</p>

      <button id="start-game-btn" class="btn btn-primary btn-block" disabled>Start game</button>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <button id="menu-btn" class="icon-btn" aria-label="Back to setup">✕</button>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="deck-count" class="deck-count">Round 1/20 · 50 left</div>
    </div>

    <div class="card-stage">
      <div id="question-card" class="question-card">
        <span id="card-category" class="card-category">Drink</span>
        <p id="card-text" class="card-text">Tap “Deal first card” to begin.</p>
      </div>
    </div>

    <div class="game-controls">
      <button id="next-btn" class="btn btn-primary btn-block">Deal first card</button>
    </div>
  </section>

  <!-- ROUND END SCREEN -->
  <section id="screen-round-end" class="screen">
    <div class="setup-card">
      <div class="logo">
        <h1 id="round-end-title">Round 1 done</h1>
      </div>
      <p class="tagline" id="round-end-tagline">50 questions down. Refill your drinks.</p>
      <button id="next-round-btn" class="btn btn-primary btn-block">Start round 2</button>
    </div>
  </section>

  <!-- END SCREEN -->
  <section id="screen-end" class="screen">
    <div class="setup-card">
      <div class="logo">
        <h1>Deck finished</h1>
      </div>
      <p class="tagline">You made it through all 1000 cards. Legends.</p>
      <button id="reshuffle-btn" class="btn btn-primary btn-block">Reshuffle and play again</button>
      <button id="back-to-setup-btn" class="btn btn-secondary btn-block">Edit players</button>
    </div>
  </section>

</main>

<script src="js/questions.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
